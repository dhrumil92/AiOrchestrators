name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: roofsolar_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/roofsolar_ci
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm test

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check for client
        id: client
        run: |
          if [ -f client/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No client yet, skipping."
          fi
      - uses: actions/setup-node@v4
        if: steps.client.outputs.exists == 'true'
        with:
          node-version: 22
      - name: Install, test and build
        if: steps.client.outputs.exists == 'true'
        working-directory: client
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm test --if-present
          npm run build --if-present
