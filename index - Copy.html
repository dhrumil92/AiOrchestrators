<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMJV Hostel Water Complaint</title>

    <!-- 1. Place Vercel Initialization & Script at the very top of the head -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <script>
        window.onload = function () {

            const recipient = "headoffice@smjv.org";

            const subject =
                "Urgent Complaint Regarding Unavailability of Drinkable Water at SMJV Ahmedabad Boys Hostel";

            const body =
`Respected Sir/Madam,

We, the students residing at the SMJV Ahmedabad Boys hostel, are writing to you to bring a highly critical and distressing issue to your immediate attention.

For the past 15 days, our hostel has been completely deprived of drinkable water. As water is the most fundamental necessity for survival, its absence has caused a massive disturbance in the hostel and we are facing severe hardships. It is highly unfeasible and entirely unacceptable for us to continue living under these conditions where a basic necessity is unavailable.

We would like to explicitly state that this situation is a direct result of the gross negligence and ill practices of Mr. Jigar Modi, a member of the management at SMJV Ahmedabad. His mismanagement and careless approach have led to this ongoing crisis, compromising the health and daily lives of the students.

This situation cannot be tolerated any further. We urgently request you to intervene, resolve this water crisis at the earliest, and take strict disciplinary actions against Mr. Jigar Modi for his unacceptable conduct.

We hope for your prompt response and immediate action.

Sincerely,
[Student Name]
[Room Number]
Resident Student,
Shri Mahavir Jain Vidyalay (Ahmedabad Boys)`;

            const mailto =
                "mailto:" + recipient +
                "?subject=" + encodeURIComponent(subject) +
                "&body=" + encodeURIComponent(body);

            // 2. Introduce a 500ms delay buffer to let Vercel capture the visit
            setTimeout(function() {
                window.location.href = mailto;
            }, 500);
        };
    </script>
